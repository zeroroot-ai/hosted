apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: monitoring, namespace: argocd }
spec:
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: gibson-crds, namespace: argocd }
spec:
  sources:
    - repoURL: ghcr.io/zeroroot-ai/charts
      chart: gibson-crds
      targetRevision: "0.136.8"
      helm:
        valuesObject:
          prometheus-operator-crds:
            enabled: false
