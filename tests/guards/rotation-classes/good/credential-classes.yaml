# Good: one tested class, one class with status no-rotation-path and a gap.
classes:
  - name: alpha-password
    lifetime: no expiry
    source: an OpenBao key
    rotation: a write at the key
    revokes_old: true
    status: tested
    test: alpha-password
    run: 1
  - name: beta-key
    lifetime: no expiry
    source: the keyring
    rotation: none
    revokes_old: false
    status: no-rotation-path
    test: none
    gap: No rotation path in code.
