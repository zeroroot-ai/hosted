# test/signup/values.yaml — the ONE overlay the signup exit test layers on the
# baseline profile (zeroroot-ai/charts helm/gibson/values-baseline.yaml) and
# the CI rung (hosted#122, launch blocker 2).
#
# The baseline profile ships global.email.provider="log" on purpose: it is the
# only transport that installs with zero operator input (deploy#1631). "log"
# is a NON-delivering stub, so with it the verification mail can never
# arrive, which is precisely the defect this test measures. This overlay swaps
# in the chart's own Mailpit dev sink (a real SMTP server with a read API) so
# a delivered message is observable, and changes nothing else.
#
# WHY THE IN-CLUSTER SINK. Stage 0 for kind makes no SMTP relay (hosted#126).
# The in-cluster sink accepts any sender with no credential
# (MP_SMTP_AUTH_ACCEPT_ANY), and the daemon sends without AUTH when the
# credential source is none.
#
# The smtp host is the chart's own Mailpit Service. Its name renders from
# {{ .Release.Name }}-mailpit (helm/gibson-workloads/templates/_helpers.tpl,
# gibson.mailpit.host). `make recreate ENV=kind` installs the umbrella as
# release "gibson", so the Service is "gibson-mailpit".
#
# Keys nest under the subchart alias (gibson-workloads:), NOT under a bare
# gibson:. A top-level gibson: overlay is silently ignored by the umbrella.
#
# No resource trims here: the CI rung (helm/gibson/values-ci.yaml) already
# fits the platform on the 2-vCPU runner, and scripts/check-2core-overlay.py
# measures the rung WITH this overlay so Mailpit's 10m/32Mi stay inside the
# budget.
gibson-workloads:
  mailpit:
    enabled: true
# One mail value for the daemon, the tenant-operator and Zitadel (hosted#223,
# charts feat/223-one-global-email). The chart fails the render on each old
# per-sender block. The in-cluster Mailpit sink listens in plaintext, offers no
# STARTTLS, and accepts any sender with no credential (MP_SMTP_AUTH_ACCEPT_ANY).
# So tlsMode is plaintext and the credential source is none. The chart refuses
# plaintext with a credential, so this pair cannot be copied into a cloud
# overlay by accident.
global:
  email:
    provider: "smtp"
    from: "no-reply@localhost.zeroroot.ai"
    fromName: "Gibson"
    smtp:
      host: "gibson-mailpit"
      port: 1025
      tlsMode: "plaintext"
      credentials:
        source: "none"
