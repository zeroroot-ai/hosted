# expect: no `if: always()`
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: make -o check-verbs check
  verbs-a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: make check-verbs-a
  verbs-b:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: make check-verbs-b
  ci-required:
    needs: [checks, verbs-a, verbs-b]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      VERBS_A_RESULT: ${{ needs.verbs-a.result }}
      VERBS_B_RESULT: ${{ needs.verbs-b.result }}
    steps:
      - run: |
          [ "${CHECKS_RESULT}" = success ] && [ "${VERBS_A_RESULT}" = success ] && [ "${VERBS_B_RESULT}" = success ]
