# Fixture: the minimal clean teardown shape. The guard must ACCEPT this.
name: teardown
on:
  workflow_dispatch:
    inputs:
      env:
        required: true
        type: choice
        options: [prod]
      mode:
        required: true
        type: choice
        options: [wipe, preserve]
concurrency:
  group: bringup-${{ inputs.env }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: Read the stage 0 files and set up the tools
        uses: ./.github/actions/stage0-setup
        with:
          env: ${{ inputs.env }}
          role-arn: ${{ vars.EKS_BRINGUP_ROLE_ARN }}
          session-name: x
      - name: make teardown
        run: make teardown ENV="${{ inputs.env }}" MODE="${{ inputs.mode }}"
