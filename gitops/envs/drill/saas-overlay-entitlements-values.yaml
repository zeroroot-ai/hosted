# DRILL env overlay. Derived from envs/staging/ and kept close to it on purpose
# (ADR-0095): a drill that proves a bringup on a shape staging does not use is
# not evidence about staging. Every path, host, bucket and address here follows
# `drill`; where a comment below still says "staging" it is describing the
# permanent environment as a different thing, not this file.
#
# What differs from staging, and only this:
#   - global.domain and every host derive from drill.zeroroot.ai
#   - the durable bucket is zeroroot-ai-drill-durable-<account>
#   - the owner and from addresses are +drill
#   - the self-hosted ARC runners and their manifests are absent: a drill proves
#     the platform and the backup chain, not an add-on staging happens to carry
#
# THIS ENVIRONMENT IS DESTROYED AFTER EVERY RUN. Its stage 1 instance also arms
# its own termination (self_terminate_after_minutes), so nothing here should be
# treated as state that survives.
# SaaS overlay: entitlements-svc values for the drill environment.
#
# Deployed as a separate Argo Application (envs/drill/apps/entitlements-svc.yaml), not as part of the core umbrella.
# ADR-0074 / deploy#1032.
#
# The core gibson Application in this env sets:
#   gibson-workloads:
#     gibson:
#       entitlementsEndpoint: "gibson-entitlements-svc:9091"
# (see envs/drill/values.yaml) — the daemon's seam knob pointing at the
# Service this overlay deploys.

# Images come from the umbrella chart's digest pins (deploy#1403).
# Staging is the RELEASE CANDIDATE: it runs the exact artifact prod
# promotes, so "staging verified it" is a true statement about prod's
# bytes. Do not re-add an image override here — that is the defect.
imagePullSecrets:
  - name: ghcr-credentials

replicas: 1

postgres:
  host: "platform-postgres-rw.gibson.svc.cluster.local"
  port: 5432
  database: "gibson_platform"
  passwordSecretName: "gibson-platform-postgres-credentials"
  passwordSecretKey: "password"
  sslMode: "require"

spiffe:
  # The trust domain comes from global.spire.trustDomain in values.yaml of
  # this env, which the Application loads first (ADR-0164).
  # The SPIRE controller-manager in this env watches className
  # "gibson-gibson" with watchClassless: false — verified by rendering this
  # env's own pinned chart. The previous "gibson-gibson-spire" matched
  # nothing, so the ClusterSPIFFEID was never reconciled, SPIRE issued no
  # entry, and entitlements-svc blocked in its X509Source fetch before it
  # could listen — a Running pod with no logs (gitops#355).
  controllerManagerClassName: "gibson-gibson"

identityAdmission:
  # The account of the core Reloader, which restarts this Deployment on a new
  # Postgres login role (hosted#162). check-env-renders-at-pin.py step 6
  # checks it against the Reloader Deployment of the core render.
  reloaderPrincipal: "system:serviceaccount:gibson:reloader"
