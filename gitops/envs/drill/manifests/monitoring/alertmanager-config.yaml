# The Alertmanager configuration of drill (D26, hosted#423). Each alert goes to
# email through the SMTP relay of stage 0. The relay credential is the one the
# daemon uses: the secret store key ses-smtp-credentials (the charts secret contract),
# which the chart mirrors into `gibson` as the Secret gibson-email-smtp. The
# store smtp-store.yaml reads that one Secret, because the chart's cluster
# store serves only the `gibson` namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gibson-email-smtp
    kind: SecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: email-smtp.us-east-1.amazonaws.com:587
            smtp_from: alerts@drill.zeroroot.ai
            smtp_require_tls: true
            smtp_auth_username: "{{ .username }}"
            smtp_auth_password: "{{ .password }}"
          route:
            receiver: email
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              # The watchdog fires all the time by design. It proves the
              # pipeline is alive and must not reach the mailbox.
              - receiver: "null"
                matchers: [alertname = "Watchdog"]
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: alerts@zeroroot.ai
                  send_resolved: true
  data:
    - secretKey: username
      remoteRef: { key: gibson-email-smtp, property: username }
    - secretKey: password
      remoteRef: { key: gibson-email-smtp, property: password }
