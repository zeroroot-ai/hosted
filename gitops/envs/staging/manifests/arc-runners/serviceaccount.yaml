# Namespaced ServiceAccount for the ephemeral ARC runner pods (envs/staging/
# arc-runners.yaml, template.spec.serviceAccountName). Deliberately NOT the
# setec operator's own identity and NOT cluster-admin — see rbac.yaml for the
# actual grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-sa
  namespace: arc-runners
