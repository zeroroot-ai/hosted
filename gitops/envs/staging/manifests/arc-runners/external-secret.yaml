# Projects the GitHub App credentials ARC needs to register the
# "staging-ephemeral" scale-set against the zeroroot-ai org (envs/staging/
# arc-runners.yaml: githubConfigSecret: arc-github-app).
#
# Source-of-truth key: the charts secret contract
# (helm/gibson/secret-contract.yaml) entry
# `arc-github-app`, producer: seed-script (no Terraform module owns ARC
# creds — a GitHub App has no Terraform-manageable secret material besides
# the private key, which the operator downloads once at App-creation time
# and seeds by hand; see the deploy PR body for the exact
# `aws secretsmanager create-secret` command).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    # PAT mode (deploy#1110): ARC's githubConfigSecret accepts a classic PAT
    # under the single `github_token` key as an alternative to the GitHub App
    # triple. The staging SM secret is seeded with a PAT (admin:org scope);
    # switch back to the app triple if/when a GitHub App is provisioned.
    - secretKey: github_token
      remoteRef:
        key: gibson/staging/arc-github-app
        property: github_token
