# The secret plane alerts (hosted#174).
#
# On 2026-09-22 every ExternalSecret in gibson read "could not get secret
# data from provider" for hours. Every pod was Running, every workload
# Ready, and one Argo Application read Degraded. The pods ran on Secrets
# written earlier, because nothing deletes a Secret when its source stops
# answering. These rules send that state to the mailbox, so a person sees
# it without opening Argo. Runbook: zeroroot-ai/docs runbooks/secret-plane-stale.md.
#
# External Secrets exports externalsecret_status_condition through the
# ServiceMonitor that values.yaml of this env turns on
# (external-secrets.serviceMonitor.enabled).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: externalsecret-alerts
  namespace: monitoring
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretNotReady
          expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready",status="False"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has not synced for 15 minutes"
            description: >-
              The pods that mount this Secret keep running on the last value
              that was written. A rotation, a restart or a new pod gets no
              Secret. Read the Ready condition of the ExternalSecret, then the
              ClusterSecretStore gibson-secrets. Runbook: runbooks/secret-plane-stale.md.
        # No metric at all is silence, and silence must not read as healthy.
        - alert: ExternalSecretMetricsAbsent
          expr: absent(externalsecret_status_condition)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus reads no External Secrets metric"
            description: >-
              The ExternalSecretNotReady alert cannot fire while this metric is
              absent. Check the external-secrets ServiceMonitor and the scrape
              of the release namespace. Runbook: runbooks/secret-plane-stale.md.
