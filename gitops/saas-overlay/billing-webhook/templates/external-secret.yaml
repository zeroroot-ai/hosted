{{/*
SaaS overlay: the Stripe credentials of billing.

The core chart holds no Stripe Secret from charts 0.140.0 (charts#375,
ADR-0060). This overlay owns the one ExternalSecret that reads the Stripe
account. It reads the OpenBao key gibson-stripe-credentials through the
chart's one cluster store. The charts secret contract declares that key with
the consumer gitops:billing (helm/gibson/secret-contract.yaml).

The target Secret holds the two keys the binary reads:
  STRIPE_SECRET_KEY      the API key (sk_test_ or sk_live_)
  STRIPE_WEBHOOK_SECRET  the signing secret of the Stripe endpoint (whsec_)
The publishable key stays in OpenBao: billing hosts no page, so it never
needs one.

ESO is the one writer of this Secret. The Secret name differs from the
gibson-stripe-credentials Secret that a core chart before 0.140.0 renders,
so the two never share a writer.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "stripe.secretName is required" .Values.stripe.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "billing-webhook.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.stripe.refreshInterval | default "60s" }}
  secretStoreRef:
    name: {{ required "stripe.storeName is required" .Values.stripe.storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.stripe.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        STRIPE_SECRET_KEY: "{{ `{{ .secret_key }}` }}"
        STRIPE_WEBHOOK_SECRET: "{{ `{{ .webhook_secret }}` }}"
  data:
    - secretKey: secret_key
      remoteRef: { key: {{ required "stripe.remoteKey is required" .Values.stripe.remoteKey }}, property: secret_key }
    - secretKey: webhook_secret
      remoteRef: { key: {{ .Values.stripe.remoteKey }}, property: webhook_secret }
