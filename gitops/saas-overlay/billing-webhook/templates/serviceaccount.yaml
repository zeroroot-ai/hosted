{{/*
SaaS overlay: billing ServiceAccount.

A workload-attestation attribute, not an API credential. The ClusterSPIFFEID
selects on the literal `k8s:sa:` of this name, and the identity admission
policy keys on it. billing never calls the Kubernetes API, so the projected
token is not mounted.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "billing-webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "billing-webhook.labels" . | nindent 4 }}
  {{- with (.Values.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
