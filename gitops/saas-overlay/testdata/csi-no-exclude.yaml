apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
spec:
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: "tmp"
    spec:
      volumes:
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: tmp
          emptyDir: {}
