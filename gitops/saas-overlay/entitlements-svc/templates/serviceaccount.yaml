{{/*
SaaS overlay: entitlements-svc ServiceAccount.

Exists to be a workload-attestation attribute, not an API credential. The
entitlements-svc pod carried no `serviceAccountName` before this template, so
it ran as the namespace `default` ServiceAccount and its ClusterSPIFFEID
could not carry a meaningful `k8s:sa:` workload selector.

entitlements-svc never calls the Kubernetes API — its plan data comes from a
mounted ConfigMap, its Postgres password from a mounted Secret and its SVID
from the Workload API socket — so the projected token is not mounted.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "entitlements-svc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "entitlements-svc.labels" . | nindent 4 }}
  {{- with (.Values.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
