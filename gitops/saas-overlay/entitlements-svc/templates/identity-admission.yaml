{{/*
SaaS overlay: platform identity admission for entitlements-svc.

The core umbrella ships the same shape for its six platform identities
(gibson-workloads/templates/spire-server/platform-identity-admission.yaml);
that file carries the full argument. In short: the literal `k8s:ns:` /
`k8s:sa:` workload selectors on the ClusterSPIFFEID next door are enforced by
the SPIRE agent against kubelet-derived facts, but they describe the POD, and
the pod is described by whoever created it. Kubernetes has had no
`serviceaccounts/use` RBAC verb since PodSecurityPolicy was removed, so a
principal holding `create pods` in this namespace can wear
`app.kubernetes.io/component: entitlements-svc` plus this ServiceAccount and
have the controller mint it a real `platform/entitlements-svc` entry — which
the gibson daemon peer-pins as an authorized entitlements provider.

`request.userInfo.username` is the only attribute a pod cannot self-assert.

This policy is overlay-owned rather than folded into the core policy so each
chart's admission list stays in lockstep with its OWN ClusterSPIFFEIDs — the
same ownership split ADR-0074 / deploy#1032 already applies to the CR itself.
There is no gitops values step for a SaaS operator to forget.

TWO POLICIES. The pods policy alone was bypassable in one extra step: the
messageExpression below literally said "Create the Deployment instead", and
that is what an adversary does — the resulting pod is created by
replicaset-controller, which is allow-listed. So a second policy validates
the pod TEMPLATE of Deployments/ReplicaSets/StatefulSets/DaemonSets/Jobs/
CronJobs on CREATE and UPDATE, and its allow-list is the intermediate
controllers plus the principal that legitimately applies this chart.

Ships in ["Deny"]. Audit/Warn evaluates the policy and admits the object
anyway; that is a report, not a control. `identityAdmission.workloadCreators`
is REQUIRED under Deny — the render fails without it, because the legitimate
creator differs per install and there is no safe default.

WHAT THIS DOES NOT PREVENT: a principal on `workloadCreators` can mint this
identity, so the boundary is GitOps write access and the Argo credential, not
admission. See the core file's residual-risk block.
*/}}
{{- $ia := (.Values.identityAdmission | default dict) -}}
{{- $protectedSAs := list (include "entitlements-svc.serviceAccountName" .) -}}
{{- $allowedCreators := concat (list
      "system:serviceaccount:kube-system:replicaset-controller"
      "system:serviceaccount:kube-system:statefulset-controller"
      "system:serviceaccount:kube-system:daemon-set-controller"
      "system:serviceaccount:kube-system:job-controller"
      "system:serviceaccount:kube-system:cronjob-controller")
      ($ia.extraAllowedCreators | default (list)) -}}
{{- $workloadCreators := concat (list
      "system:serviceaccount:kube-system:deployment-controller"
      "system:serviceaccount:kube-system:cronjob-controller")
      ($ia.workloadCreators | default (list)) -}}
{{- /* Reloader (stakater, --reload-strategy=annotations) restarts this
       Deployment when its Postgres login role changes (ADR-0171, row
       postgres-role-passwords). It rewrites one pod-template annotation and
       nothing else, so the workloads policy admits its UPDATE only when the
       pod template's spec and labels are byte-identical to the old object's,
       the same rule as the platform policy of the charts
       (gibson-platform-identity-workloads, restartOnly). Without it the
       policy refused the restart. Reloader v1.4.6 stops its whole pass on the
       first refused update (handler/upgrade.go, PerformAction), and the List
       API gives gibson-billing-webhook first, so no consumer of the login
       role restarted: drill rotation run 40478619844 kept 6 sessions of the
       old role, 4 of them in the daemon. */ -}}
{{- /* The account Reloader writes as. The overlay cannot read it: Reloader
       belongs to the core release, which may run elsewhere. So each env
       names it, and scripts/check-env-renders-at-pin.py (step 6) checks it
       against the Reloader Deployment of the core render. */ -}}
{{- $reloaderPrincipal := $ia.reloaderPrincipal | default "" -}}
{{- $actions := $ia.actions | default (list "Deny") -}}
{{- if and (has "Deny" $actions) (empty $reloaderPrincipal) -}}
{{- fail "identityAdmission.actions requests Deny but identityAdmission.reloaderPrincipal is empty. The workloads policy must admit the restart of this Deployment by Reloader when its Postgres login role changes (ADR-0171), and the overlay cannot know the account of the core Reloader. Name it, e.g. reloaderPrincipal: \"system:serviceaccount:gibson:reloader\"." -}}
{{- end -}}
{{- if and (has "Deny" $actions) (empty ($ia.workloadCreators | default (list))) -}}
{{- fail "identityAdmission.actions requests Deny but identityAdmission.workloadCreators is empty. That policy governs who may create or update a workload whose pod template claims the entitlements-svc identity, and the legitimate creator differs per install — the Argo CD application-controller ServiceAccount on a GitOps cluster, the identity running `helm install` elsewhere. Name it, e.g. workloadCreators: [\"system:serviceaccount:argocd:argocd-application-controller\"]." -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gibson-saas-identity-pods
  labels:
    {{- include "entitlements-svc.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: component
      expression: >-
        has(object.metadata.labels) && 'app.kubernetes.io/component' in object.metadata.labels
          ? object.metadata.labels['app.kubernetes.io/component']
          : ''
    - name: sa
      expression: >-
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName != ''
          ? object.spec.serviceAccountName
          : 'default'
    - name: claimsPlatformIdentity
      expression: >-
        variables.component == 'entitlements-svc'
          || variables.sa in {{ $protectedSAs | toJson }}
  validations:
    - expression: >-
        !variables.claimsPlatformIdentity
          || request.userInfo.username in {{ $allowedCreators | toJson }}
      reason: Forbidden
      messageExpression: >-
        'pod claims the Gibson entitlements-svc identity (component=' + variables.component +
        ', serviceAccount=' + variables.sa +
        ') but was created by ' + request.userInfo.username +
        ', which is not a built-in workload controller. Create the workload object' +
        ' instead — it is validated by gibson-saas-identity-workloads — or add this principal to' +
        ' identityAdmission.extraAllowedCreators if it is a legitimate installer.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gibson-saas-identity-pods
  labels:
    {{- include "entitlements-svc.labels" . | nindent 4 }}
spec:
  policyName: gibson-saas-identity-pods
  validationActions: {{ $actions | toJson }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
{{/*
The controller-object half. See the core chart's
platform-identity-admission.yaml for the full argument: keying on the pod's
creator cannot help when the adversary can create the object that creates
the pod.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gibson-saas-identity-workloads
  labels:
    {{- include "entitlements-svc.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podTemplate
      expression: >-
        has(object.spec.jobTemplate)
          ? object.spec.jobTemplate.spec.template
          : object.spec.template
    - name: component
      expression: >-
        has(variables.podTemplate.metadata) && has(variables.podTemplate.metadata.labels)
          && 'app.kubernetes.io/component' in variables.podTemplate.metadata.labels
          ? variables.podTemplate.metadata.labels['app.kubernetes.io/component']
          : ''
    - name: sa
      expression: >-
        has(variables.podTemplate.spec) && has(variables.podTemplate.spec.serviceAccountName)
          && variables.podTemplate.spec.serviceAccountName != ''
          ? variables.podTemplate.spec.serviceAccountName
          : 'default'
    - name: claimsPlatformIdentity
      expression: >-
        variables.component == 'entitlements-svc'
          || variables.sa in {{ $protectedSAs | toJson }}
    # A restart-only UPDATE by Reloader: the pod template's spec and labels are
    # unchanged, only template annotations moved. Nothing new claims the
    # identity, so the admitted creator's template is re-issued.
    - name: restartOnly
      expression: >-
        request.operation == 'UPDATE'
          && request.userInfo.username == {{ $reloaderPrincipal | toJson }}
          && !has(object.spec.jobTemplate)
          && has(oldObject.spec) && has(oldObject.spec.template)
          && object.spec.template.spec == oldObject.spec.template.spec
          && (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {})
             == (has(oldObject.spec.template.metadata) && has(oldObject.spec.template.metadata.labels) ? oldObject.spec.template.metadata.labels : {})
  validations:
    - expression: >-
        !variables.claimsPlatformIdentity
          || request.userInfo.username in {{ $workloadCreators | toJson }}
          || variables.restartOnly
      reason: Forbidden
      messageExpression: >-
        'workload pod template claims the Gibson entitlements-svc identity (component=' + variables.component +
        ', serviceAccount=' + variables.sa +
        ') but the object was written by ' + request.userInfo.username +
        ', which is not a permitted creator of platform workloads. Add this principal to' +
        ' identityAdmission.workloadCreators if it legitimately deploys this chart.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gibson-saas-identity-workloads
  labels:
    {{- include "entitlements-svc.labels" . | nindent 4 }}
spec:
  policyName: gibson-saas-identity-workloads
  validationActions: {{ $actions | toJson }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
