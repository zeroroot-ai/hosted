# Umbrella-chart digest ledger (hosted#116, the consuming half of deploy#1194).
#
# WHAT THIS IS
#
# One entry per chartVersion an env under envs/ pins. Each entry records the
# registry digest that version resolved to when scripts/verify-chart-signature.sh
# admitted it, and whether that digest carries a valid cosign signature.
#
# WHY A LEDGER AND NOT JUST A SIGNATURE CHECK
#
# zeroroot-ai/charts signs every umbrella-chart publish with cosign, keyless
# through GitHub Actions OIDC, over the chart's CONTENT DIGEST and not the
# mutable tag. Verifying that signature proves the bytes came from the
# publish-umbrella-chart workflow. It does NOT stop a tag swap: a re-run of
# that same trusted workflow republishes `gibson:0.128.0` over different bytes,
# and the new digest is signed by the same identity. A signature check alone
# accepts it.
#
# The digest recorded here closes that. `envs/<env>/gibson.yaml` pins a tag.
# This file pins what that tag is allowed to mean. If the registry resolves a
# recorded version to a different digest, the tag moved, and
# scripts/verify-chart-signature.sh fails. exit-test-chart-signing.yml runs it
# on main and on dispatch. No workflow runs on a schedule, so a swap that lands
# after a merge is caught by the next merge to main or by a dispatch.
#
# WHY NOT PIN THE DIGEST IN THE ARGO APPLICATION
#
# It does not work for Helm OCI charts. ArgoCD appends a semver `--version`
# flag when the revision is a digest, which breaks Helm-packaged OCI charts
# (plain OCI artifacts are fine). Upstream: argoproj/argo-cd#24970 and #25078.
# ArgoCD also has no Application field that verifies a cosign signature for a
# Helm OCI source. So verification is a gate on the way in, not an admission
# check at sync time. See the header of scripts/verify-chart-signature.sh.
#
# WHO SIGNS
#
# zeroroot-ai/charts, since the 2026-09-04 split (ADR-0086). The deleted deploy
# repo signed every version before that, and the registry no longer serves any
# of them. A pin on such a version fails the live check with "cannot resolve",
# and the fix is a promotion onto a version charts published, never a wider
# identity regexp.
#
# HOW TO ADD AN ENTRY
#
# A promotion to a version not listed here fails the guard. Record it with:
#
#     scripts/verify-chart-signature.sh --record <version>
#
# which resolves the live digest, verifies the signature, and writes the entry.
# promote-bump.yml runs that for every promotion. Never hand-edit a `digest:`.
# Delete an entry when no env pins its version any more.

charts:
  # prod. Published and signed by the deleted deploy repo. The registry no
  # longer serves the tag, so prod pins a chart nobody can pull, and the live
  # check fails on it until prod is promoted onto a version staging proved
  # (hosted#116).
  "0.113.0":
    digest: "sha256:814388d935d235e6bce6d57fbab2ce87a75eb4f2ec4104f010c520773c9100be"
    signed: true

  # dev. Same state as prod: signed by the deleted deploy repo, tag no longer
  # served. Nothing on the kind path reads this pin (the kind verb installs
  # from a charts checkout), so it is stale rather than dangerous.
  "0.119.0":
    digest: "sha256:b750e2785ba3cdec1f1c76ca245cce2024f35ba818bdee250f3a12004322d8b6"
    signed: true

