name: ci-setup
description: >-
  The tools that the merge gate needs: Python and PyYAML, a checkout of
  zeroroot-ai/charts, helm, bats and actionlint. The jobs of ci.yml share it,
  so each job installs the same set.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'

    # check-exit-tests-off-pr.py parses workflow YAML. PyYAML is the only
    # dependency any guard has outside the standard library.
    - name: Install guard dependencies
      shell: bash
      run: python3 -m pip install -r requirements-ci.txt

    # check-2core-overlay renders the umbrella and gibson-velero from a
    # charts checkout (CHARTS_ROOT), the way the recreate verb does.
    - name: Check out zeroroot-ai/charts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        repository: zeroroot-ai/charts
        path: charts

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
      with:
        version: v3.16.2

    # Six guards, each of which self-tests before it scans: it proves it can
    # still fail on a planted violation, then runs for real. A guard that
    # cannot fail is worse than no guard. The sixth is check-teardown, four
    # offline bats suites that stub aws/kubectl/kind on PATH, so they need no
    # cluster and no network. Three of the four had pointed at the pre-split
    # path since ADR-0086 and therefore ran NOTHING; they were outside the
    # aggregate gate, so nobody saw it. Both halves are fixed here.
    # bats from its pinned release on GitHub, not from apt: the Ubuntu
    # mirror hung this step past the job timeout three times on 2026-10-07.
    - name: Install bats
      shell: bash
      run: |
        scripts/install-bats.sh "$HOME/.local"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # actionlint, for check-workflows. A workflow with a bad expression is
    # rejected by GitHub at dispatch and reports failure with no jobs and no
    # log, so the merge gate is the only place it can be caught.
    - name: Install actionlint
      shell: bash
      run: |
        set -euo pipefail
        ver=1.7.7
        curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin actionlint
        actionlint --version
