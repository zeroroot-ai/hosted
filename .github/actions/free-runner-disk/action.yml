name: Free runner disk
description: >-
  Delete the preinstalled toolchains that no kind exit test uses, so the
  install fits on the root volume of a GitHub-hosted runner. ubuntu-latest
  guarantees 14 GB free on /, and the toolchains below hold about 25 GB
  (charts exit-test-baseline-install run 34121599474 died with "No space
  left on device"; hosted exit-test-substrate run 38361259263 died with
  "Free space left: 0 MB"). The one copy of this step (hosted#700).
runs:
  using: composite
  steps:
    - name: Free runner disk
      shell: bash
      run: |
        set -euo pipefail
        echo "before: $(df -h / | tail -1)"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        sudo docker image prune -af >/dev/null 2>&1 || true
        echo "after:  $(df -h / | tail -1)"
