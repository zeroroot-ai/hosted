name: demo-enrollment-install
description: >-
  The baseline install at the CI rung (or, with overlay set, the SAME install with an
  overlay layered on) plus the tools a drill needs against it: charts and
  gibson checkouts, the adk CLI, buf, the kind bring-up (make substrate, make
  recreate ENV=kind with the CI rung), the readiness gates
  charts exit-test-baseline-install.yml proves, and the host map for the platform's
  edge. Both jobs of exit-test-demo-enrollment.yml, and
  exit-test-identity.yml's online leg, run this once, on their own runner, so
  the bring-up lives in one place (ADR-0027 — one installer, never a second
  hand-copied one).
inputs:
  charts_ref:
    description: The zeroroot-ai/charts ref to install (branch, tag or SHA)
    required: false
    default: main
  ghcr_pull_token:
    description: The GHCR read token that becomes the keyring member GHCR_PULL_TOKEN
    required: true
  github_token:
    description: The job token, for ghcr.io login and the buf download
    required: true
  adk_commit:
    description: The zeroroot-ai/adk commit the gibson CLI is built from
    required: true
  overlay:
    description: >-
      One named overlay of the recreate verb (hosted#425): identity or demo.
      Empty (default) installs the baseline at the CI rung, unchanged.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # The chart source. A dispatch names the ref; push and schedule install
    # charts main: the exit test measures the platform as it ships today.
    # The ref resolves to a commit of a branch or a tag of the charts
    # repository first. A pull request ref is refused.
    - name: Resolve the charts ref
      id: charts
      uses: ./.github/actions/charts-ref
      with:
        ref: ${{ inputs.charts_ref }}

    - name: Check out zeroroot-ai/charts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        repository: zeroroot-ai/charts
        ref: ${{ steps.charts.outputs.sha }}
        path: charts

    - name: Record the chart source under test
      shell: bash
      run: |
        echo "charts: $(git -C "$CHARTS_ROOT" rev-parse HEAD) ($(git -C "$CHARTS_ROOT" describe --tags --always))"
        test -d "$CHARTS_ROOT/helm/gibson" || { echo "::error::no chart source at $CHARTS_ROOT/helm/gibson"; exit 1; }

    # The tenant ProviderService proto (step 6) is daemon-local: it lives in
    # the gibson repository, not in the published SDK module. Check out the
    # daemon version the chart pins, so the schema matches the daemon under
    # test.
    - name: Resolve the daemon version the chart pins
      id: daemon
      shell: bash
      run: |
        set -euo pipefail
        tag="$(grep -E '^\s+tag: "v[0-9]+\.[0-9]+\.[0-9]+@sha256:' "$CHARTS_ROOT/helm/gibson-workloads/values.yaml" | head -1 | sed -E 's/.*tag: "(v[0-9]+\.[0-9]+\.[0-9]+)@.*/\1/')"
        test -n "$tag" || { echo "::error::cannot read the gibson image tag from $CHARTS_ROOT/helm/gibson-workloads/values.yaml"; exit 1; }
        echo "daemon: $tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Check out zeroroot-ai/gibson at the pinned daemon version
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        repository: zeroroot-ai/gibson
        ref: ${{ steps.daemon.outputs.tag }}
        path: gibson
        sparse-checkout: |
          internal/server/daemon/api
        sparse-checkout-cone-mode: true

    # The mirror images stage 0 and the kind node pull live on ghcr.io
    # packages of this org. The job's own token reads them.
    - name: Log in to ghcr.io
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    # The install needs more disk than the runner's root volume has free
    # (charts exit-test-baseline-install.yml carries the measurement).
    - name: Free runner disk
      uses: ./.github/actions/free-runner-disk

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
      with:
        version: v3.16.2

    # kind + kubectl only. `make recreate ENV=kind` creates the cluster
    # itself (with /dev/kvm of the host mounted into the node).
    - name: Install kind + kubectl
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
      with:
        install_only: true

    - name: Install Terraform
      uses: ./.github/actions/install-terraform

    # The adk CLI: `gibson login` and `gibson agent enroll`, built from the
    # pinned commit. The Go module is the nested gibson/ module of adk.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.26.x'
        cache: false

    - name: Install the adk CLI (gibson)
      shell: bash
      run: |
        set -euo pipefail
        go install "github.com/zeroroot-ai/adk/gibson/cmd/gibson@${{ inputs.adk_commit }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        "$(go env GOPATH)/bin/gibson" --help >/dev/null

    # buf curl is the gRPC client of the assertions: it encodes each request
    # from the published SDK module (buf.build/zeroroot-ai/sdk) or from the
    # daemon-local tree checked out above.
    - name: Install buf
      # bufbuild/buf-setup-action ships no annotated v1 tag, only a moving
      # `v1` branch; the SHA is the one zeroroot-ai/sdk pins.
      uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      with:
        github_token: ${{ inputs.github_token }}

    # The one fact every scheduling failure hangs on.
    - name: Runner facts
      shell: bash
      run: |
        echo "runner cpus: $(nproc)"
        free -h | head -2

    # Stage 0 (ADR-0083): the durable bucket, the stage 0 relay, the DNS
    # sub-zone and the bringup keyring, on the runner's kind Docker network.
    # The caller passes its job token (packages: read). The private billing
    # images grant this repository read access in their package settings, so
    # no long-lived PAT exists for them. The token becomes the keyring member
    # GHCR_PULL_TOKEN; the sidecar seeds ghcr-pull-secret from it.
    - name: Stage 0 (make substrate ENV=kind)
      shell: bash
      env:
        GHCR_PULL_TOKEN: ${{ inputs.ghcr_pull_token }}
      run: |
        if [ -z "${GHCR_PULL_TOKEN}" ]; then
          echo "::error::No GHCR pull token was passed. The keyring member GHCR_PULL_TOKEN stays empty, first-party images will not pull and the install cannot succeed."
          exit 1
        fi
        SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

    # ONE PATH: the verb an operator runs, with the CI rung and — unless a
    # caller names an overlay — no overlay. The rung lowers scheduling
    # REQUESTS so the platform fits the 2-vCPU runner; the shipped profile is
    # untouched either way.
    - name: Stand the platform up (make recreate ENV=kind)
      shell: bash
      env:
        OVERLAY: ${{ inputs.overlay }}
      run: |
        SUBSTRATE_DIR="$RUNNER_TEMP/substrate" \
          RUNG=ci \
          OVERLAY="$OVERLAY" \
          WAIT_APPS_TIMEOUT=5400 make recreate ENV=kind

    - name: Workloads reach Ready
      shell: bash
      run: |
        set -euo pipefail
        kubectl -n "$NS" wait --for=condition=Available deploy --all --timeout=15m
        for sts in $(kubectl -n "$NS" get sts -o name); do
          kubectl -n "$NS" rollout status "$sts" --timeout=10m
        done

    # The install's own seeded tenant and its founding member, the same
    # gate charts exit-test-baseline-install.yml proves: a member stuck Invited
    # fail-closes every tenant RPC (gibson#1510), and the drill would then
    # report a login failure that is really an install failure.
    - name: The seeded tenant is Ready and the first admin is Active
      shell: bash
      run: |
        set -euo pipefail
        TENANT=$(kubectl get tenants.gibson.zeroroot.ai -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TENANT" ]; then
          echo "::error::the install seeded no Tenant CR"
          exit 1
        fi
        kubectl wait --for=jsonpath='{.status.phase}'=Ready "tenant/${TENANT}" --timeout=15m
        # ADR-0093, hosted#202: no password is ever generated or stored, so
        # the first-admin Job's own success is the signal, not a credential
        # Secret's existence.
        kubectl -n "$NS" wait --for=condition=complete job/gibson-gibson-workloads-first-admin --timeout=15m
        phase=""
        for _ in $(seq 1 90); do
          phase=$(kubectl -n "tenant-${TENANT}" get tenantmembers.gibson.zeroroot.ai \
            -o jsonpath='{.items[?(@.spec.role=="owner")].status.phase}' 2>/dev/null || true)
          [ "$phase" = "Active" ] && break
          sleep 10
        done
        if [ "$phase" != "Active" ]; then
          echo "::error::founding member phase is '${phase:-<absent>}', want Active (gibson#1510)"
          exit 1
        fi
        echo "tenant ${TENANT} is Ready, founding member is Active"

    # The adk CLI, buf and the agent container dial the platform's hosts by
    # name. The runner has no DNS for them, so the Envoy LoadBalancer
    # address (cloud-provider-kind, on the kind Docker network the runner
    # reaches directly) is mapped in /etc/hosts. The runner is disposable.
    - name: Map the platform hosts to the edge
      shell: bash
      run: |
        set -euo pipefail
        domain="$(kubectl -n "$NS" get configmap gibson-domains -o jsonpath='{.data.domain}')"
        edge="$(kubectl -n "$NS" get svc "${RELEASE}-envoy" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
        if [ -z "$domain" ] || [ -z "$edge" ]; then echo "::error::no domain or no Envoy LoadBalancer address"; exit 1; fi
        echo "${edge} api.${domain} app.${domain}" | sudo tee -a /etc/hosts
        getent hosts "api.${domain}"

    # The first tenant's Owner has no password (ADR-0093, hosted#202): the
    # exit test completes the offline setup link itself, through the same
    # Playwright/TOTP driver the Platform owner exit test uses
    # (test/platform-owner/driver.mjs, never a second one). ubuntu-latest
    # ships Node.js already; only the driver's own deps need installing.
    - name: Install the setup-link driver (playwright + otpauth)
      shell: bash
      run: |
        set -euo pipefail
        # A fixed browser path, not ~/.cache: the exit tests set HOME to a
        # temp dir for their kubeconfig, and Playwright resolves its browsers
        # from HOME unless this is set.
        browsers="${RUNNER_TEMP}/ms-playwright"
        echo "PLAYWRIGHT_BROWSERS_PATH=${browsers}" >> "$GITHUB_ENV"
        export PLAYWRIGHT_BROWSERS_PATH="${browsers}"
        npm --prefix test/platform-owner install --no-audit --no-fund
        npx --prefix test/platform-owner playwright install --with-deps chromium
        node -e "console.log('playwright', require('./test/platform-owner/node_modules/playwright/package.json').version)"
