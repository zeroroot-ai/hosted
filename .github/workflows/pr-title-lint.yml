name: pr-title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The merge queue requires this context on the merge-group commit too. The
  # title was validated on the pull request, so on merge_group the job reports
  # success without re-running the check (attic#23).
  merge_group:

permissions:
  pull-requests: read

jobs:
  pr-title-lint:
    name: pr-title-lint
    runs-on: ubuntu-latest
    steps:
      - name: merge group
        if: github.event_name == 'merge_group'
        run: echo "title validated on the pull request; nothing to lint on a merge group"
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the conventional commits subject pattern. Please ensure
            the subject does not start with an uppercase character.
