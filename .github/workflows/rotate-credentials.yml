# ----------------------------------------------------------------------------
# rotate-credentials — the one place where a keyring member or an access key of
# a stage 0 IAM user rotates for staging and prod (ADR-0083, amendment of
# 2026-10-21; ADR-0171, rows keyring-generated-keys and
# substrate-cloud-credentials). No workstation path exists: keyring.sh rotate,
# keyring.sh retire and substrate-rotate.sh refuse to run outside GitHub
# Actions.
#
# workflow_dispatch only, with no schedule. The GitHub environment of the
# `env` input gates each run: it needs the approval of its required reviewers.
#
# Auth:
#   AWS     GitHub OIDC assumes the key rotation role of the env (variable
#           KEY_ROTATION_ROLE_ARN of the environment; substrate/gibson-bootstrap/
#           rotation-role.tf). It can write the access keys of the stage 0
#           users and the state under tfstate/stage0/, and read the rest of
#           stage 0. It is not the bringup role.
#   cluster the environment secret KUBECONFIG.
#   GitHub  a GitHub App (variable KEYRING_APP_ID, secret
#           KEYRING_APP_PRIVATE_KEY) writes the new environment secret
#           BRINGUP_KEYRING and the new environment variable SUBSTRATE_ENV_FILE.
#           The App token is made after the rotation, and only in the step that
#           writes them. The workflow token holds no write permission.
#
# The keyring and substrate.env are read from the environment, changed by one
# step of scripts/rotate-credential.sh, and written back when that step ended
# done (exit 0) or waiting (exit 10). Exit 10 is an access key rotation that
# moved the cluster to the new key and waits for AWS to show the old key
# unused. The cluster already runs on the new key, so the environment must hold
# it. A later dispatch continues the rotation from the slots in the state. Any
# other exit writes nothing, and the old values stay.
#
# Guard: scripts/check-verb-workflows.py (the verb-workflow-guard CI job).
# ----------------------------------------------------------------------------
name: rotate-credentials

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment. The GitHub environment of the same name gates the run.
        required: true
        type: choice
        options: [staging, prod]
      credential:
        description: An access key user (platform, smtp, dns, setec-disk-builder) or a keyring member that rotates in place.
        required: true
        type: choice
        options:
          - platform
          - smtp
          - dns
          - setec-disk-builder
          - OPENBAO_SEAL_KEY
          - VELERO_REPO_PASSWORD
          - SETEC_DISK_SIGNING_SEED
      step:
        description: rotate, or retire for a keyring member after the cluster runs on the new value. An access key has only rotate, and a run continues an open rotation.
        required: true
        type: choice
        options: [rotate, retire]
      velero_prefix:
        description: Only for VELERO_REPO_PASSWORD rotate. The new bucket.prefix that the merged overlay names.
        required: false
        type: string

# One bringup verb or rotation at a time per environment, across the verb
# workflows. Never cancel a running rotation.
concurrency:
  group: bringup-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC, aws-actions/configure-aws-credentials

env:
  KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"

jobs:
  rotate:
    name: rotate ${{ inputs.credential }} (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 345
    env:
      ENV: ${{ inputs.env }}
      CREDENTIAL: ${{ inputs.credential }}
      STEP: ${{ inputs.step }}
      EXPECT_VELERO_PREFIX: ${{ inputs.velero_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Read the keyring, substrate.env and the kubeconfig from the environment
        env:
          BRINGUP_KEYRING: ${{ secrets.BRINGUP_KEYRING }}
          SUBSTRATE_ENV_FILE: ${{ vars.SUBSTRATE_ENV_FILE }}
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          SUBSTRATE_DIR="${RUNNER_TEMP}/substrate"
          echo "SUBSTRATE_DIR=${SUBSTRATE_DIR}" >> "$GITHUB_ENV"
          state="${SUBSTRATE_DIR}/${ENV}"
          umask 077
          mkdir -p "$state"
          if [ -z "${BRINGUP_KEYRING}" ]; then
            echo "::error::Environment secret BRINGUP_KEYRING is empty or missing for environment '${ENV}'."
            exit 2
          fi
          if [ -z "${SUBSTRATE_ENV_FILE}" ]; then
            echo "::error::Environment variable SUBSTRATE_ENV_FILE is empty or missing for environment '${ENV}'."
            exit 2
          fi
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "::error::Environment secret KUBECONFIG is empty or missing for environment '${ENV}'. The rotation restarts the readers of each credential, so it needs the cluster."
            exit 2
          fi
          printf '%s\n' "${BRINGUP_KEYRING}" > "$state/keyring.env"
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            v="${line#*=}"
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < "$state/keyring.env"
          printf '%s\n' "${SUBSTRATE_ENV_FILE}" \
            | sed "s|^KEYRING_FILE=.*|KEYRING_FILE=$state/keyring.env|" > "$state/substrate.env"
          test "$(grep -c '^KEYRING_FILE=' "$state/substrate.env")" = 1
          printf '%s' "${KUBECONFIG_CONTENT}" > "$state/kubeconfig"
          echo "KUBECONFIG=$state/kubeconfig" >> "$GITHUB_ENV"
          # What the environment holds now, to tell whether the run changed it.
          sha256sum < "$state/keyring.env" | cut -d' ' -f1 > "$state/.read-keyring.sha256"
          sha256sum < "$state/substrate.env" | cut -d' ' -f1 > "$state/.read-substrate.sha256"

      - name: The role ARN variable must be set
        env:
          ROLE_ARN: ${{ vars.KEY_ROTATION_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Environment variable KEY_ROTATION_ROLE_ARN is not set for '${ENV}'."
            echo "The role is substrate/gibson-bootstrap/rotation-role.tf. Apply stage 0 with rotation_role_enabled, then set the variable to the output rotation_role_arn." >&2
            exit 1
          fi
          echo "OK, the role ARN is configured."

      - name: Configure AWS credentials (OIDC role assumption)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.KEY_ROTATION_ROLE_ARN }}
          role-session-name: gh-actions-rotate-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: 21600

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Install Terraform
        uses: ./.github/actions/install-terraform

      - name: Install the Python requirements
        run: python3 -m pip install --quiet -r requirements-ci.txt

      - name: Install helm, kubectl and the SSM session-manager plugin
        uses: ./.github/actions/install-cluster-tools

      # One step of one rotation. The step never fails the job by itself: the
      # exit code goes to the outputs, and the last step decides. An exit 10
      # is a rotation that waits (substrate-rotate.sh).
      - name: Rotate
        id: rotate
        env:
          # A run does not wait hours for a key to be used. The next dispatch looks again.
          WAIT_SECS: "900"
          SLEEP_SECS: "30"
          SECRET_WAIT_SECS: "600"
        run: |
          set -uo pipefail
          state="${SUBSTRATE_DIR}/${ENV}"
          # Stage 0 needs the public ids of the Argo CD GitHub App (substrate.env).
          sget() { grep -E "^$1=" "$state/substrate.env" | head -n1 | cut -d= -f2- || true; }
          TF_VAR_argocd_github_app_id="$(sget GITHUB_APP_ID)"
          TF_VAR_argocd_github_app_installation_id="$(sget GITHUB_APP_INSTALLATION_ID)"
          export TF_VAR_argocd_github_app_id TF_VAR_argocd_github_app_installation_id
          scripts/rotate-credential.sh "$state" "$ENV" "$CREDENTIAL" "$STEP"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mask the new keyring values
        if: ${{ steps.rotate.outputs.rc == '0' || steps.rotate.outputs.rc == '10' }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            v="${line#*=}"
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < "${SUBSTRATE_DIR}/${ENV}/keyring.env"

      # The App token exists only after a rotation that moved the cluster.
      - name: Make the GitHub App token
        id: app
        if: ${{ steps.rotate.outputs.rc == '0' || steps.rotate.outputs.rc == '10' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          app-id: ${{ vars.KEYRING_APP_ID }}
          private-key: ${{ secrets.KEYRING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-secrets: write
          permission-variables: write

      # The new keyring and the new substrate.env, in one step, in this order.
      # The files are read from disk and never echoed.
      - name: Write the keyring and substrate.env back to the environment
        if: ${{ steps.rotate.outputs.rc == '0' || steps.rotate.outputs.rc == '10' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          state="${SUBSTRATE_DIR}/${ENV}"
          if [ "$(sha256sum < "$state/keyring.env" | cut -d' ' -f1)" != "$(cat "$state/.read-keyring.sha256")" ]; then
            gh secret set BRINGUP_KEYRING --env "$ENV" --repo "$GITHUB_REPOSITORY" < "$state/keyring.env"
            echo "BRINGUP_KEYRING of ${ENV} holds the new keyring."
          else
            echo "The keyring did not change."
          fi
          if [ "$(sha256sum < "$state/substrate.env" | cut -d' ' -f1)" != "$(cat "$state/.read-substrate.sha256")" ]; then
            gh variable set SUBSTRATE_ENV_FILE --env "$ENV" --repo "$GITHUB_REPOSITORY" < "$state/substrate.env"
            echo "SUBSTRATE_ENV_FILE of ${ENV} holds the new substrate.env."
          else
            echo "substrate.env did not change."
          fi

      - name: Result
        env:
          RC: ${{ steps.rotate.outputs.rc }}
        run: |
          case "$RC" in
            0)  echo "The rotation step is done." ;;
            10) echo "::notice::The rotation waits for AWS to show the old key unused. Dispatch this workflow again later with the same inputs." ;;
            3)  echo "::error::The rotation halted: a person must act first. Read the log of the Rotate step."; exit 1 ;;
            *)  echo "::error::The rotation step failed with exit ${RC:-none}. The environment keyring is unchanged. Read the log of the Rotate step."; exit 1 ;;
          esac
