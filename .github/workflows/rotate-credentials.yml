# ----------------------------------------------------------------------------
# rotate-credentials — the one place where a keyring member or an access key of
# a stage 0 IAM user rotates for staging and prod (ADR-0083, amendment of
# 2026-10-21; ADR-0171, rows keyring-generated-keys and
# substrate-cloud-credentials). This workflow is the one documented entry
# point, and the IAM policy of the rotation role limits what it can change.
#
# workflow_dispatch only, with no schedule. The GitHub environment of the
# `env` input gates each run: it needs the approval of its required reviewers.
#
# Auth:
#   AWS     GitHub OIDC assumes the key rotation role of the env (variable
#           KEY_ROTATION_ROLE_ARN of the environment; substrate/gibson-bootstrap/
#           rotation-role.tf). It can write the access keys of the stage 0
#           users and the state under tfstate/stage0/, and read the rest of
#           stage 0. It is not the bringup role.
#   cluster the same path as the other workflows. Staging goes through
#           scripts/with-cluster.sh (an SSM port forward, because the instance
#           publishes no API port). Prod goes through `make eks-kubeconfig`.
#           There is no kubeconfig secret.
#   keyring the Secrets Manager secret zeroroot-ai/<env>/keyring holds the
#           keyring and substrate.env of every environment. The same OIDC role
#           reads it and, after a rotation, writes it. That role can read and
#           write only that secret. The workflow token holds no write
#           permission, and there is no GitHub App.
#
# The keyring and substrate.env are read from the environment, changed by one
# step of scripts/rotate-credential.sh, and written back in two cases:
#   1. the step ended done (exit 0) or waiting (exit 10) after the keyring went
#      to the cluster. Exit 10 is an access key rotation that waits for AWS to
#      show the old key unused. A later dispatch continues it from the slots in
#      the state.
#   2. the step ended with any other exit, or the run was cancelled or timed out,
#      AFTER the point where the cluster may hold the new keyring. The script
#      marks that point with the file .cluster-keyring-pushed. The write-back
#      steps always run and read the marker from the disk. The environment must hold the keyring that the
#      cluster holds, so the next run does not make a second new value over it.
#      The job still fails in this case.
# An exit before that point writes nothing, and the old values stay.
#
# Guard: scripts/check-verb-workflows.py (the verb-workflow-guard CI job).
# ----------------------------------------------------------------------------
name: rotate-credentials

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment. The GitHub environment of the same name gates the run.
        required: true
        type: choice
        options: [staging, prod]
      credential:
        description: An access key user (platform, smtp, dns, setec-disk-builder) or a keyring member that rotates in place.
        required: true
        type: choice
        options:
          - platform
          - smtp
          - dns
          - setec-disk-builder
          - OPENBAO_SEAL_KEY
          - VELERO_REPO_PASSWORD
          - SETEC_DISK_SIGNING_SEED
      step:
        description: rotate, or retire for a keyring member after the cluster runs on the new value. An access key has only rotate, and a run continues an open rotation. recover rebuilds the keyring from the cluster after a failed write-back (the credential input is ignored).
        required: true
        type: choice
        options: [rotate, retire, recover]
      accept_changed:
        description: Only for recover. Members (space separated) whose change since substrate.env is the one to keep. The stop message names them.
        required: false
        type: string
      empty_members:
        description: Only for recover. Previous or input members (space separated) that are empty in the keyring.
        required: false
        type: string
      velero_prefix:
        description: Only for VELERO_REPO_PASSWORD rotate. The new bucket.prefix that the merged overlay names.
        required: false
        type: string

# One bringup verb or rotation at a time per environment, across the verb
# workflows. Never cancel a running rotation.
concurrency:
  group: bringup-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC, aws-actions/configure-aws-credentials

env:
  KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"

jobs:
  rotate:
    name: rotate ${{ inputs.credential }} (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 345
    env:
      ENV: ${{ inputs.env }}
      CREDENTIAL: ${{ inputs.credential }}
      STEP: ${{ inputs.step }}
      EXPECT_VELERO_PREFIX: ${{ inputs.velero_prefix }}
      ACCEPT_CHANGED: ${{ inputs.accept_changed }}
      EMPTY_MEMBERS: ${{ inputs.empty_members }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: The role ARN variable must be set
        env:
          ROLE_ARN: ${{ vars.KEY_ROTATION_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Environment variable KEY_ROTATION_ROLE_ARN is not set for '${ENV}'."
            echo "The role is substrate/gibson-bootstrap/rotation-role.tf. Apply stage 0 with rotation_role_enabled, then set the variable to the output rotation_role_arn." >&2
            exit 1
          fi
          echo "OK, the role ARN is configured."

      - name: Configure AWS credentials (OIDC role assumption)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.KEY_ROTATION_ROLE_ARN }}
          role-session-name: gh-actions-rotate-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: 21600

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      # The keyring and substrate.env of the environment come from its Secrets
      # Manager secret, with the key slots and the rotation record from the
      # state bucket. The rotation role can read both. The files land on disk
      # with mode 0600 and are never echoed. Each member value is registered
      # with the masker.
      - name: Read the keyring and the stage 0 files of the environment from AWS
        run: |
          set -euo pipefail
          SUBSTRATE_DIR="${RUNNER_TEMP}/substrate"
          echo "SUBSTRATE_DIR=${SUBSTRATE_DIR}" >> "$GITHUB_ENV"
          state="${SUBSTRATE_DIR}/${ENV}"
          scripts/stage0-store.sh pull "$ENV" "$state"
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            v="${line#*=}"
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < "$state/keyring.env"
          test "$(grep -c '^KEYRING_FILE=' "$state/substrate.env")" = 1

      - name: Install Terraform
        uses: ./.github/actions/install-terraform

      - name: Install the Python requirements
        run: python3 -m pip install --quiet -r requirements-ci.txt

      - name: Install helm, kubectl and the SSM session-manager plugin
        uses: ./.github/actions/install-cluster-tools

      # One step of one rotation. The step never fails the job by itself: the
      # exit code goes to the outputs, and the last step decides. An exit 10
      # is a rotation that waits (substrate-rotate.sh).
      - name: Rotate
        id: rotate
        env:
          # A run does not wait hours for a key to be used. The next dispatch looks again.
          WAIT_SECS: "900"
          SLEEP_SECS: "30"
          SECRET_WAIT_SECS: "600"
        run: |
          set -uo pipefail
          state="${SUBSTRATE_DIR}/${ENV}"
          # Stage 0 needs the public ids of the Argo CD GitHub App (substrate.env).
          sget() { grep -E "^$1=" "$state/substrate.env" | head -n1 | cut -d= -f2- || true; }
          TF_VAR_argocd_github_app_id="$(sget GITHUB_APP_ID)"
          TF_VAR_argocd_github_app_installation_id="$(sget GITHUB_APP_INSTALLATION_ID)"
          export TF_VAR_argocd_github_app_id TF_VAR_argocd_github_app_installation_id
          if [ "$STEP" = recover ]; then
            # The recovery reads the cluster itself, by the same paths as below
            # (scripts/recover-keyring.sh). The member lists are words of capital
            # letters and underscores, and nothing else.
            args=()
            for m in ${ACCEPT_CHANGED}; do [[ "$m" =~ ^[A-Z_]+$ ]] || { echo "::error::accept_changed holds '$m', which is not a member name"; exit 1; }; args+=(--accept-changed "$m"); done
            for m in ${EMPTY_MEMBERS}; do [[ "$m" =~ ^[A-Z_]+$ ]] || { echo "::error::empty_members holds '$m', which is not a member name"; exit 1; }; args+=(--empty "$m"); done
            scripts/recover-keyring.sh "$ENV" "$state" "${args[@]}"; rc=$?
          else
          # The cluster path of the other workflows: an SSM forward for staging
          # (scripts/with-cluster.sh passes the exit code of the command on),
          # the EKS kubeconfig for prod.
          case "$ENV" in
            staging) scripts/with-cluster.sh staging scripts/rotate-credential.sh "$state" "$ENV" "$CREDENTIAL" "$STEP"; rc=$? ;;
            prod)    make eks-kubeconfig ENV=prod \
                       && KUBECONFIG="/tmp/eks-prod.kubeconfig" scripts/rotate-credential.sh "$state" "$ENV" "$CREDENTIAL" "$STEP"; rc=$? ;;
            *)       echo "::error::ENV=$ENV has no cluster path"; rc=2 ;;
          esac
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # The decision is read from the disk, in a step that always runs: a cancel,
      # a timeout or a failed step between Rotate and here must not skip the
      # write-back. The marker file says the cluster may hold the new keyring.
      - name: Decide the write-back
        id: decide
        if: ${{ always() }}
        run: |
          set -uo pipefail
          state="${SUBSTRATE_DIR:-}/${ENV}"
          if [ -n "${SUBSTRATE_DIR:-}" ] && [ -e "$state/.cluster-keyring-pushed" ] && [ -s "$state/keyring.env" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
            while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              v="${line#*=}"
              if [ -n "$v" ]; then echo "::add-mask::$v"; fi
            done < "$state/keyring.env"
          else
            echo "write=false" >> "$GITHUB_OUTPUT"
          fi

      # The new keyring and the new substrate.env, into the keyring secret. The
      # files are read from disk and never echoed.
      - name: Write the keyring and substrate.env back to the environment
        if: ${{ always() && steps.decide.outputs.write == 'true' }}
        run: |
          set -euo pipefail
          state="${SUBSTRATE_DIR}/${ENV}"
          [ -e "$state/.cluster-keyring-pushed" ] || { echo "No marker on disk: nothing to write back."; exit 0; }
          scripts/keyring-writeback.sh "$state" "$ENV"

      - name: Result
        if: ${{ always() }}
        env:
          RC: ${{ steps.rotate.outputs.rc }}
        run: |
          case "$RC" in
            0)  echo "The rotation step is done." ;;
            10) echo "::notice::The rotation waits for AWS to show the old key unused. Dispatch this workflow again later with the same inputs." ;;
            3)  echo "::error::The rotation halted: a person must act first. Read the log of the Rotate step."; exit 1 ;;
            *)  if [ -n "${SUBSTRATE_DIR:-}" ] && [ -e "${SUBSTRATE_DIR}/${ENV}/.cluster-keyring-pushed" ]; then
                  echo "::error::The rotation step failed with exit ${RC:-none} after the cluster may have received the new keyring. The environment now holds that keyring. Read the log of the Rotate step before the next run."
                else
                  echo "::error::The rotation step failed with exit ${RC:-none}. The environment keyring is unchanged. Read the log of the Rotate step."
                fi
                exit 1 ;;
          esac
