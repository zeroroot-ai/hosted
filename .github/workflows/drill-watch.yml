name: drill-watch
# Fails, and opens one issue, when the newest successful `drill` run is older
# than 36 hours (hosted#427, ADR-0095). Also fails, and opens one issue, when
# no successful `drill` run in the last 35 days passed its rotation step
# (drill sweep row 22). The monthly rotation run is one scheduled run, and a
# daily green run does no rotation, so the first check cannot see a month
# with no rotation.
#
# WHY THIS EXISTS. drill.yml runs each day and opens an issue for a failed
# stage. A `drill` that does not run opens nothing: a disabled schedule, a
# run that stops before its first stage and a run that nobody dispatched all
# look the same as a green `drill`. hosted#470 is the proof: the workflow
# failed at its first step for four days, and no issue opened.
#
# It is a separate workflow on purpose. A check inside drill.yml cannot report
# that drill.yml did not start.
#
# ONE LIMIT. GitHub disables each scheduled workflow of a repository after 60
# days with no activity in that repository. That rule stops this workflow too.
# It does not apply while pull requests merge here.
#
# It touches no cluster, no cloud and no secret. It reads the run history of
# this repository with the workflow token.

on:
  schedule:
    # Each 6 hours. The limit is 36 hours, so a missed daily run is reported
    # in the 12 hours after it was due.
    - cron: "40 */6 * * *"
  workflow_dispatch:

concurrency:
  group: drill-watch
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  watch:
    name: a drill run succeeded in the last 36 hours, and a rotation in 35 days
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The check proves first that it can fail, with its fixtures.
      - name: The check can fail
        run: python3 scripts/check-drill-freshness.py --selftest

      - name: The newest successful drill run is inside the limit
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow drill.yml --status success --limit 5 \
            --json databaseId,conclusion,updatedAt > runs.json
          python3 scripts/check-drill-freshness.py runs.json 2> verdict.txt || rc=$?
          cat verdict.txt >&2
          exit "${rc:-0}"

      # The run list has no steps, so the jobs of each successful run of the
      # last 35 days give the conclusion of its rotation step. A run with no
      # rotation step gets "".
      - name: A successful drill run passed its rotation step in the last 35 days
        id: rotation
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STEP: Rotate each credential class, and prove its path
        run: |
          set -euo pipefail
          since="$(date -u -d '-35 days' +%Y-%m-%d)"
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow drill.yml --status success \
            --created ">=${since}" --limit 100 --json databaseId,conclusion,updatedAt > rot-runs.json
          echo '[]' > rotation.json
          for id in $(jq -r '.[].databaseId' rot-runs.json); do
            r="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
                  --jq "[.jobs[].steps[] | select(.name == env.STEP) | .conclusion][0] // \"\"")"
            jq --argjson id "$id" --arg r "$r" \
              '. + [(input | map(select(.databaseId == $id))[0]) + {rotation: $r}]' \
              rotation.json rot-runs.json > rotation.next && mv rotation.next rotation.json
          done
          python3 scripts/check-drill-freshness.py --rotation rotation.json 2> rotation-verdict.txt || rc=$?
          cat rotation-verdict.txt >&2
          exit "${rc:-0}"

      # One issue, and no second issue while the first is open.
      - name: Open one issue when no rotation passed in 35 days
        if: ${{ failure() && steps.rotation.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="drill: no passed rotation run in 35 days"
          open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "issue #${open} is open for this state. No second issue."
            exit 0
          fi
          verdict="$(cat rotation-verdict.txt 2>/dev/null || echo 'the check gave no text')"
          gh issue create --repo "${GITHUB_REPOSITORY}" --label ready-for-agent --title "$title" \
            --body "The check \`drill-watch\` failed: ${RUN_URL}"$'\n\n'"${verdict}"$'\n\n'"The monthly run of \`drill\` (cron 10 12 1 * *) did not pass its rotation step. Read that run. Then dispatch \`drill\` with \`rotation: true\`. Close this issue when one rotation run is green."

      # One issue, and no second issue while the first is open.
      - name: Open one issue when the check failed
        if: ${{ failure() && steps.fresh.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="drill: no successful run in 36 hours"
          open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "issue #${open} is open for this state. No second issue."
            exit 0
          fi
          verdict="$(cat verdict.txt 2>/dev/null || echo 'the check gave no text')"
          gh issue create --repo "${GITHUB_REPOSITORY}" --label ready-for-agent --title "$title" \
            --body "The check \`drill-watch\` failed: ${RUN_URL}"$'\n\n'"${verdict}"$'\n\n'"Read the newest runs of \`drill\`. If the schedule is disabled, enable the workflow. If each run fails, find the cause in the run log. Close this issue when one run is green."
