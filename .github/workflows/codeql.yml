# CodeQL is the only tool in CI that follows data flow through the code
# (ADR-0018). hosted holds more than twenty Python guards, the bringup shell
# scripts and the verb workflows, so it runs the one shared scan of the
# organization (hosted#416). The shared workflow sets the suite
# `security-extended`. This file sets the languages and the triggers only.
#
# Check names: `codeql / CodeQL (python)` and `codeql / CodeQL (actions)`.
# Alerts stay in the Security tab. No workflow opens an issue for an alert.

name: codeql

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@58931387de5d0f2925ee29fa9781822b1e3a100d # v0.20.0
    with:
      languages: '["python","actions"]'
