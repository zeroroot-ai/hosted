# CodeQL is the only tool in CI that follows data flow through the code
# (ADR-0018). hosted holds more than twenty Python guards, the bringup shell
# scripts, the verb workflows and the Node.js drivers of the exit tests
# (test/**/*.mjs), so it runs the one shared scan of the organization
# (hosted#416). The shared workflow sets the suite `security-extended`. This
# file sets the languages and the triggers only.
#
# javascript-typescript covers the exit-test drivers. Until hosted#47 only the
# default setup of 2026-10-19 had scanned them, and no later run read them.
#
# Check names: `codeql / CodeQL (python)`, `codeql / CodeQL (actions)` and
# `codeql / CodeQL (javascript-typescript)`.
# Alerts stay in the Security tab. No workflow opens an issue for an alert.

name: codeql

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@a88e99f641209c147aad6cbd3b6d62c2764485ca # v0.21.3
    with:
      languages: '["python","actions","javascript-typescript"]'
