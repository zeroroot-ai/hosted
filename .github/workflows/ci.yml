# ----------------------------------------------------------------------------
# The merge gate. Before this file, the only workflow here that ran on a pull
# request was pr-title-lint.yml — so the PR title was checked and nothing else
# was. Every guard in `make check` ran on nothing.
#
# It could not have run anyway: `make check` was broken. It depended on five
# targets deleted with the Go guard surface (build, test, cross-chart-check,
# envoy-route-check, digest-pin-check) and on five scripts that did not survive
# the 2026-09-04 split (ADR-0086). Repairing it is the other half of this PR.
#
# ADR-0080: exit tests never run on a pull request, and check-exit-tests-off-pr
# in this very suite enforces that. This is not an exit test. It touches no
# cluster, no cloud and no secret.
#
# THE GATE RUNS IN TWO PARALLEL JOBS. The merge gate budget is ten minutes.
# `make check` took 14 minutes 46 seconds on main, 8 of them in check-verbs, in
# a job limit of 15. The run of 14:13 UTC on main and the run of hosted#70 were
# cancelled by that limit. `checks` runs everything but check-verbs, `verbs-a`
# and `verbs-b` run its two halves, and `ci-required` reports the one verdict. The jobs run on
# pull_request, merge_group and push to main. scripts/check-ci-lanes.py keeps
# the split.
# ----------------------------------------------------------------------------
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # check-promotion-pr diffs the change set against the base branch.
          # A shallow checkout has no merge-base, and the guard then exits 2
          # with a message instead of guarding (gitops#561).
          fetch-depth: 0

      # ADR-0009: no service uses the Kubernetes auth method of OpenBao or any
      # other TokenReview login (hosted#417). The action tests its own scanner
      # against each token first, then scans this tree. It runs before the
      # charts checkout of ci-setup, so it reads only the files of this repo.
      - name: OpenBao auth deny-list
        uses: zeroroot-ai/.github/actions/vault-auth-deny-list@a88e99f641209c147aad6cbd3b6d62c2764485ca  # v0.21.3
        with:
          repo-root: ${{ github.workspace }}

      - uses: ./.github/actions/ci-setup

      # check-target-role-policy renders a Terraform local with `terraform console`.
      - name: Install Terraform
        uses: ./.github/actions/install-terraform

      # Every guard of make check but check-verbs, which the two verbs jobs run.
      # -o makes make treat check-verbs as made.
      - name: make check, without check-verbs
        run: CHARTS_ROOT="$GITHUB_WORKSPACE/charts" make -o check-verbs check

      # The promotion guards that read a change set (hosted#116, blocker 5):
      # the prod pin moves only to the version staging pins, and no env moves
      # its pin and its values.yaml together. Only a pull request has a
      # change set. The base ref goes through env, never into the script.
      - name: make check-promotion-pr
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          make check-promotion-pr BASE="origin/${BASE_REF}"

  verbs-a:
    name: verbs-a
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/ci-setup
      - name: make check-verbs-a
        run: CHARTS_ROOT="$GITHUB_WORKSPACE/charts" make check-verbs-a

  verbs-b:
    name: verbs-b
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/ci-setup
      - name: make check-verbs-b
        run: CHARTS_ROOT="$GITHUB_WORKSPACE/charts" make check-verbs-b

  # The ruleset requires the context `ci-required`. Keep this name in step with
  # rulesets/repo/hosted.json in zeroroot-ai/.github, or main blocks on a check
  # that never reports. It is the one verdict of the two jobs above. It runs
  # always, and it fails on any result but success: a skipped or a cancelled
  # job (a job timeout, a concurrency cancel) is not a pass.
  ci-required:
    name: ci-required
    needs: [checks, verbs-a, verbs-b]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      VERBS_A_RESULT: ${{ needs.verbs-a.result }}
      VERBS_B_RESULT: ${{ needs.verbs-b.result }}
    steps:
      - name: Every job succeeded
        run: |
          echo "checks: ${CHECKS_RESULT}"
          echo "verbs-a: ${VERBS_A_RESULT}"
          echo "verbs-b: ${VERBS_B_RESULT}"
          [ "${CHECKS_RESULT}" = success ] && [ "${VERBS_A_RESULT}" = success ] && [ "${VERBS_B_RESULT}" = success ]
