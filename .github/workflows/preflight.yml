# ----------------------------------------------------------------------------
# preflight — the preflight verb as a workflow (ADR-0083, deploy#1745).
#
# Same name and inputs as `make preflight ENV=<env>`, and the job runs exactly
# that target. The GitHub environment named by the `env` input gates the run:
# `staging` has no reviewers, `prod` requires one named reviewer for the
# destructive verbs (docs/bringup.md § Who may run what). Preflight itself is
# read-only against the substrate, but it still runs on the environment so the
# keyring secret is scoped to it.
#
# The keyring and substrate.env reach the runner from the Secrets Manager
# secret zeroroot-ai/<env>/keyring (ADR-0083, amendment of 2026-10-22), through
# an OIDC session on the keyring reader role of the environment
# (substrate/gibson-bootstrap/keyring-reader-role.tf). That role can read that
# one secret and nothing else. The keyring is written to disk mode 0600 and
# NEVER echoed. preflight then proves the substrate live with the keyring's
# platform credential only: the make step starts with the role session
# removed from its environment, so no ambient credential can answer for it
# (scripts/preflight.sh).
#
# Guard: scripts/check-verb-workflows.py (the verb-workflow-guard CI job)
# with failing fixtures under scripts/testdata/verb-workflows/.
# ----------------------------------------------------------------------------
name: preflight

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment. The GitHub environment of the same name gates the run.
        required: true
        type: choice
        options: [staging, prod]

# One bringup verb at a time per environment, across all three verb
# workflows (the group is repo-scoped). Never cancel a running verb: a
# half-cancelled teardown is a half-destroyed estate.
concurrency:
  group: bringup-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC, aws-actions/configure-aws-credentials

env:
  # The WebSocket transport of kubectl drops stream bytes and the exec still
  # exits 0 (hosted#10). scripts/check-kubectl-spdy.py keeps this line.
  KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"

jobs:
  preflight:
    name: preflight (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 15
    env:
      ENV: ${{ inputs.env }}
    steps:
      - name: Checkout deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: The keyring reader role ARN variable must be set
        env:
          ROLE_ARN: ${{ vars.KEYRING_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Environment variable KEYRING_READER_ROLE_ARN is not set for '${ENV}'."
            echo "The role is substrate/gibson-bootstrap/keyring-reader-role.tf. Apply stage 0 with keyring_reader_role_enabled, then set the variable to the output keyring_reader_role_arn." >&2
            exit 1
          fi
          echo "OK, the role ARN is configured."

      - name: Configure AWS credentials (OIDC role assumption)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.KEYRING_READER_ROLE_ARN }}
          role-session-name: gh-actions-preflight-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      # The keyring file lands on disk mode 0600 and is never echoed. Every
      # member value is registered with the runner's masker. KEYRING_FILE inside
      # substrate.env is repointed at this runner's copy.
      - name: Read the keyring and substrate.env from Secrets Manager
        run: |
          set -euo pipefail
          SUBSTRATE_DIR="${RUNNER_TEMP}/substrate"
          echo "SUBSTRATE_DIR=${SUBSTRATE_DIR}" >> "$GITHUB_ENV"
          state="${SUBSTRATE_DIR}/${ENV}"
          scripts/stage0-store.sh pull-keyring "$ENV" "$state"
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            v="${line#*=}"
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < "$state/keyring.env"
          test "$(grep -c '^KEYRING_FILE=' "$state/substrate.env")" = 1

      # The printf below must render as OPENBAO_SEAL_KEY=*** in the log: the
      # value was registered with ::add-mask:: in the step above, so the
      # runner replaces it before the log is written. A readable value here
      # means the masker never saw the keyring this run uses — stop and
      # rotate the keyring (scripts/keyring.sh, README.md § Rotation).
      # THE SEAL KEY IS NEVER PRINTED, AND IS REGISTERED WITH THE MASKER.
      #
      # This step used to print the key and then say, in prose, that the line
      # above ought to read ***. It asserted nothing: if the value was not
      # masked the key went to the log in clear and the step still passed.
      #
      # Worse, the property it was testing is not one anything established. The
      # runner masks repository and environment secrets. This value is read
      # from a keyring file that stage 0 writes ON the runner, so nothing had
      # taught the masker about it — the check could only pass by accident,
      # when the key happened to have arrived from a secret.
      #
      # So: add-mask it, which is what actually makes it unprintable for the
      # rest of the job, and prove identity with a short sha256 rather than the
      # value. A 12-hex prefix of a sha256 is not reversible.
      - name: The keyring's seal key is present, and masked from here on
        run: |
          set -euo pipefail
          v="$(scripts/keyring.sh get "${SUBSTRATE_DIR}/${ENV}/keyring.env" OPENBAO_SEAL_KEY)"
          if [ -z "$v" ]; then
            echo "::error::the keyring holds no OPENBAO_SEAL_KEY. Stage 0 did not write one, or this run is pointed at the wrong keyring (README.md, Rotation)."
            exit 1
          fi
          echo "::add-mask::$v"
          printf '✓ OPENBAO_SEAL_KEY present and now masked (sha256 %s)\n' \
            "$(printf '%s' "$v" | sha256sum | cut -c1-12)"

      - name: make preflight
        run: |
          set -euo pipefail
          # The role session is removed: preflight answers with the keyring's own credential.
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u AWS_PROFILE make preflight ENV="${ENV}"
