# ----------------------------------------------------------------------------
# recreate — the recreate verb as a workflow (ADR-0083, deploy#1745).
#
# Same name and inputs as `make recreate ENV=<env> [RESTORE_FROM=<name>]`,
# and the job runs exactly that target: preflight, stage 1, stage 2, then a
# restore ONLY when `restore_from` names a backup. An empty `restore_from`
# means every store bootstraps empty, even if the bucket holds a hundred
# backups (ADR-0083). There is no auto-detect and no `latest`. The GitHub
# environment named by the `env` input gates the run: `prod` waits for the
# one named reviewer (docs/bringup.md § Who may run what).
#
# THE INPUT DOES NOT OFFER STAGING (ADR-0095, hosted#403). Staging stays up,
# and no workflow rebuilds it. An operator who must rebuild staging runs
# `make recreate ENV=staging` from a workstation, after the serverName pull
# request. scripts/check-staging-not-ephemeral.py fails when the option comes
# back.
#
# Stage 0 state reaches the runner from the keyring secret in Secrets Manager
# (mode 0600, never echoed), through the .github/actions/stage0-setup action.
#
# The bringup body for the AWS envs is scripts/recreate-aws.sh (deploy#1746).
# A `restore_from` puts the secret store back BEFORE the platform Application
# exists: the verb holds the app-of-apps back, creates the CRDs and the backup
# plane straight from the gitops overlay, restores, and only then applies the
# root again so the platform appears.
#
# The cloud credential is an OIDC session on the eks-bringup role
# (bootstrap/eks/aws-org github-oidc.tf), trusted only for this repo's staging and prod
# environments and only for the verb workflows.
#
# Guard: scripts/check-verb-workflows.py (the verb-workflow-guard CI job)
# with failing fixtures under scripts/testdata/verb-workflows/.
# ----------------------------------------------------------------------------
name: recreate

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment. The GitHub environment of the same name gates the run.
        required: true
        type: choice
        options: [prod]
      restore_from:
        description: Backup name to restore. Empty means every store bootstraps empty (ADR-0083).
        required: false
        type: string

# One bringup verb at a time per environment, across all three verb
# workflows (the group is repo-scoped). Never cancel a running verb: a
# half-cancelled teardown is a half-destroyed estate.
concurrency:
  group: bringup-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC — aws-actions/configure-aws-credentials

env:
  # The WebSocket transport of kubectl drops stream bytes and the exec still
  # exits 0 (hosted#10). scripts/check-kubectl-spdy.py keeps this line.
  KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"

jobs:
  recreate:
    name: recreate (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 90
    env:
      ENV: ${{ inputs.env }}
      RESTORE_FROM: ${{ inputs.restore_from }}
    steps:
      - name: Checkout deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The keyring and substrate.env come from the Secrets Manager secret of the
      # environment (ADR-0083, amendment of 2026-10-22) through the OIDC session
      # of this job on the bringup role. The action also masks each member, checks
      # the seal key, and installs Terraform, Helm, kubectl and the SSM plugin.
      # The bringup role is trusted only for this repo's environments and only for
      # the verb workflows (bootstrap/eks/aws-org/github-oidc.tf, eks_bringup).
      - name: Read the stage 0 files and set up the tools
        uses: ./.github/actions/stage0-setup
        with:
          env: ${{ inputs.env }}
          role-arn: ${{ vars.EKS_BRINGUP_ROLE_ARN }}
          session-name: gh-actions-recreate-${{ github.run_id }}

      - name: make recreate
        # The org GitHub App has one job: the Argo clone of the repositories
        # (ADR-0084). keyring-to-cluster.sh (run inside make recreate) reads
        # these values from the environment and writes one Secret, the Argo
        # repo-creds Secret argocd/zeroroot-ai-creds. The values are not
        # keyring members. The keyring fingerprint contract is shared with
        # kind, so the App must not touch it. The App id and the installation
        # id are not secret (vars). The private-key PEM is a secret. When an
        # env has no App configured, keyring-to-cluster.sh skips the Secret.
        env:
          GITHUB_APP_ID: ${{ vars.ARGOCD_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.ARGOCD_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ARGOCD_GITHUB_APP_PRIVATE_KEY }}
          # A restore writes the catch-up bundle here and opens no PR itself:
          # the catch-up job below does, with the write token (D91, hosted#687).
          RESTORE_CATCH_UP_PR: later
          RESTORE_CATCH_UP_DIR: ${{ runner.temp }}/restore-catch-up
        run: |
          set -euo pipefail
          if [ -n "${RESTORE_FROM}" ]; then
            make recreate ENV="${ENV}" RESTORE_FROM="${RESTORE_FROM}"
          else
            make recreate ENV="${ENV}"
          fi

      # The bundle of the catch-up PR: the overlay with the new archive name,
      # the body, and the branch. Only a restore writes one.
      - name: Upload the catch-up bundle
        if: ${{ inputs.restore_from != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: restore-catch-up
          path: ${{ runner.temp }}/restore-catch-up
          if-no-files-found: error
          retention-days: 7

  # Git catches up (D91). This job holds the write token and runs no verb: it
  # pushes one branch with one changed line and opens the PR. The recreate
  # job above, which holds the bringup role, keeps contents: read
  # (hosted#687). A PR that github.token opens starts no workflow, so its
  # reviewer starts the merge gate.
  catch-up:
    name: catch-up PR (${{ inputs.env }})
    needs: recreate
    if: ${{ inputs.restore_from != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Download the catch-up bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: restore-catch-up
          path: ${{ runner.temp }}/restore-catch-up
      - name: Open the catch-up PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/restore-catch-up.sh "${RUNNER_TEMP}/restore-catch-up"
