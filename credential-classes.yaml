# =============================================================================
# credential-classes.yaml: the one list of credential classes (hosted#444).
#
# Each entry is one class of credential in the drill environment. The entry
# names its lifetime, the source where its value lives, and its rotation path.
# The code is the ground truth for each field. Each field names the file that
# holds the path.
#
# THE ROTATION TEST. A drill dispatch with `rotation: true` does one run of
# the rotation plan (the input `rotation_run`, the field `run`). Each run
# brings drill up, runs
# test/rotation/exit-test-rotation.sh, and tears drill down. The status of
# each class tells the script what to do:
#
#   tested            the script calls the function class_<test>. The
#                     function rotates the value at its source, through the
#                     normal path, with no hand step. Then it proves the path
#                     that uses the credential, and, where the class revokes
#                     the old value, it proves that the old value fails. A
#                     failure fails the run, opens one issue and sends one
#                     alert (drill.yml).
#   no-test           the code has an automated rotation path, and no test
#                     proves it yet. The script records the class as untested.
#                     It does not fail the run.
#   no-rotation-path  the code has no automated rotation path. The script
#                     records the class as untested. It does not fail the run.
#
# The scope of the untested classes is an open decision (hosted#444). Until
# that decision, the run asserts only the tested classes.
#
# The test never writes a Kubernetes Secret (ADR-0014). It changes a value at
# its source: an OpenBao key, or a cert-manager Certificate.
#
# `make check-rotation-classes` (scripts/check-rotation-classes.py) fails when
# a tested class has no test function, when a test function belongs to no
# tested class, and when an untested class has no `gap`.
#
# Fields:
#   name         the class, kebab-case
#   lifetime     how long one value lives, as the code sets it
#   source       where the value lives. A rotation changes it here
#   rotation     the rotation path, as the code has it
#   revokes_old  true when the path makes the old value fail
#   status       tested, no-test or no-rotation-path
#   test         the test name with status tested, else none
#   run          only with status tested. The run of the rotation plan that
#                tests the class (1 to ROTATION_RUNS of scripts/drill-plan.sh).
#                The worst-case times of all the classes do not fit one step
#                of drill.yml, so each run is one dispatch of drill. The
#                sum of the time bounds of each run fits the budget of one
#                step: exit-test-rotation.sh refuses to start when it does
#                not, and tests/harness/rotation-budget.bats checks it at
#                each change. substrate-cloud-credentials is in run 1, the
#                run that starts the access key rotation, so it proves the
#                open rotation in the same job.
#   gap          only with an untested status. Why no test proves the class
# =============================================================================

classes:
  - name: redis-password
    lifetime: no expiry. The OpenBao seed kind `pw` generates it once and keeps it.
    source: OpenBao key gibson-redis-password, property password
    rotation: >-
      A new value at the OpenBao key (charts scripts/baseline-set-secret.sh,
      which also forces the ExternalSecret to refresh). ESO writes the Secret
      gibson-redis-stack. The CronJob gibson-redis-rotation adds the new
      password to the running store, restarts the daemon, the
      tenant-operator, ext-authz and ratelimit, and then removes the old
      password (charts#528). redis-stack does not restart. The seed table
      gives the key a lifetime of 720 hours.
    revokes_old: true
    status: tested
    test: redis-password
    run: 3

  - name: edge-tls
    lifetime: 90 days, set by Let's Encrypt. cert-manager renews it at two thirds of its life.
    source: cert-manager Certificate gibson-envoy-edge, issuer letsencrypt-prod (DNS-01 on Route53)
    rotation: >-
      cert-manager issues a new certificate and writes it to the Secret
      gibson-envoy-tls. Envoy serves it on the public edge
      (charts helm/gibson-workloads/templates/cert-manager/certificate.yaml).
      The test starts the renewal with `cmctl renew`, which starts the same
      issuance that a renewal at two thirds of the life starts.
    revokes_old: false
    status: tested
    test: edge-tls
    run: 3

  - name: component-tls
    lifetime: 2160 hours (90 days). cert-manager renews it 360 hours before the end.
    source: cert-manager Certificates gibson-daemon-metrics-tls, gibson-ext-authz-health-tls, gibson-openfga-http-tls, issuer selfsigned-ca
    rotation: >-
      cert-manager renews each certificate
      (charts helm/gibson-workloads/templates/cert-manager/component-certificates.yaml).
      Reloader restarts the daemon, ext-authz and OpenFGA when their
      certificate Secret changes, because each listener loads its certificate
      at start (charts#522). The root CA keeps its key at renewal, so each
      client keeps its trust. The test starts the renewal with `cmctl renew`
      and proves that each pod serves the new serial and no pod serves the
      old one. The selfsigned CA has no revocation list, so the old half is
      that the old certificate is no longer served. The caller half is a new
      ext-authz pod, whose startup self-check calls OpenFGA over TLS. The
      metrics and health listeners have no working TLS client today
      (charts#543).
    revokes_old: false
    status: tested
    test: component-tls
    run: 2

  - name: spire-svid
    lifetime: 4 hours for an X.509 SVID, 24 hours for the X.509 authority (the SPIRE chart defaults).
    source: the X.509 authority of the SPIRE server
    rotation: >-
      The SPIRE agent renews each SVID at half its life. The SPIRE server
      prepares the next authority at half of the CA TTL and activates it
      when one sixth of the TTL is left. The test runs the same
      authority rotation by hand with `spire-server localauthority x509`:
      prepare, wait for the bundle, activate, taint the old authority, and
      revoke it. It proves that the daemon and ext-authz serve SVIDs of the
      new authority, that a new ext-authz pod gets its registry from the
      daemon over mTLS after the taint and after the revoke, and that the
      bundle no longer holds the old authority.
    revokes_old: true
    status: tested
    test: spire-svid
    run: 3

  - name: openbao-service-tokens
    lifetime: 24 hours. Each token has a period of 1 hour and is renewed until it is replaced.
    source: OpenBao, the service tokens that the openbao-auto-init sidecar mints into gibson-platform-operator-vault, gibson-tenant-operator-vault and the Job token Secrets
    rotation: >-
      The sidecar mints a successor of a token older than 24 hours, or older
      than the rotation request at the OpenBao key gibson-service-token-rotation
      (property requested_at), writes the Secret, and revokes the old token by
      accessor 15 minutes later (charts#532). Reloader restarts the
      tenant-operator, and the platform-operator follows its token file
      (gibson#1036). The same path rotates the token of each configuration
      Job. The test writes the rotation request. This path is on charts main
      after charts#533 and the charts pin of gibson v0.156.0 or later.
    revokes_old: true
    status: tested
    test: openbao-service-tokens
    run: 1

  - name: postgres-role-passwords
    lifetime: 48 hours for each login role; a new one every 24 hours
    source: the OpenBao database engine (charts, pg_engine_ensure), one connection and one role for each owner of a platform database (gibson_platform, tenant_admin, zitadel, openfga, spire)
    rotation: >-
      ESO asks database/creds/<owner> for a new login role every 24 hours (a
      VaultDynamicSecret generator), and writes username and password into
      the Secret of its consumers; Reloader restarts each consumer. The login
      role is a member of the owner and sets role to it, so each object stays
      owned by the owner. Its password ends with its lease, and the engine
      then reassigns and drops it. The owner roles log in no more. The test
      forces a refresh of each.
    revokes_old: true
    status: tested
    test: postgres-role-passwords
    run: 2
  - name: neo4j-password
    lifetime: none. The credential does not exist.
    source: none. The platform Neo4j had no client, so it and its OpenBao key gibson-neo4j-password are deleted (ADR-0171, D78).
    rotation: >-
      None is needed. The chart renders no platform Neo4j, no seed key and no
      Secret for it (charts#563). Each tenant has its own Neo4j from the
      tenant-operator. The test proves that no key, Secret, workload or
      Service of the platform Neo4j exists, and that no
      ExternalSecret reads its OpenBao key.
    revokes_old: true
    status: tested
    test: neo4j-password
    run: 2

  - name: platform-signing-keys
    lifetime: 720 hours, then a successor. The old kid verifies for 25 more hours.
    source: OpenBao keys gibson-cg-signing-key, gibson-cg-signing-key-next and gibson-cg-signing-key-previous
    rotation: >-
      The openbao-auto-init sidecar publishes a new kid in -next, promotes it
      to current 10 minutes later (previous = the old current), and clears
      -previous 25 hours after that, the longest token life plus the
      ext-authz key cache (charts#555). The daemon reads its key directory
      again when it changes (gibson#1035). The test writes -next, waits for
      the promotion, and writes the clear of -previous itself.
    revokes_old: true
    status: tested
    test: platform-signing-keys
    run: 3

  - name: platform-generated-secrets
    lifetime: the System API key 720 hours, the masterkey 2160 hours, the dashboard session secret 720 hours
    source: OpenBao keys gibson-zitadel-system-bot-key, gibson-zitadel-system-bot-key-b, gibson-zitadel-system-active, zitadel-masterkey, gibson-dashboard-session-secrets
    rotation: >-
      The openbao-auto-init sidecar rotates each by age. The System API key
      flips to the other of two System API users, then gives the old one a new
      key (charts#570, gibson#1054). The masterkey goes to `next`, and the
      CronJob zitadel-masterkey-rotation proves its marker, rewraps every
      Zitadel key in one transaction and moves it to `value` (charts#572). The
      session secret keeps its old value as auth_secret_previous, which the
      dashboard accepts (charts#553, dashboard#274). The test writes each
      source with the same write.
    revokes_old: true
    status: tested
    test: platform-generated-secrets
    run: 2
  - name: openfga-preshared-key
    lifetime: 720 hours, set in the seed table of charts (openbao-seed-keys.txt)
    source: OpenBao key gibson-openfga-preshared-key, properties key and key_previous
    rotation: >-
      The openbao-auto-init sidecar writes a new key when the key is older than
      its lifetime, and moves the old one to key_previous (charts#637). ESO
      writes the Secret gibson-openfga-preshared-key. Reloader restarts
      OpenFGA, which accepts key and key_previous. Each client (the daemon,
      ext-authz, both operators, fga-init, the first-admin Job) reads the
      mounted key files again within ten seconds, and sends key_previous again
      after a 401 (gibson#1091). The next rotation drops the old key, and
      OpenFGA refuses it. The test writes the source with the same write, and
      proves the client half on the daemon: its readiness runs an OpenFGA
      Check with its key, so each daemon pod stays Ready through both
      rotations with no restart.
    revokes_old: true
    status: tested
    test: openfga-preshared-key
    run: 3

  - name: zitadel-bringup-tokens
    lifetime: 30 days, then a successor. Each token lives 90 days.
    source: OpenBao keys gibson-zitadel-iam-admin-pat and gibson-zitadel-login-client-pat, which the platform-operator mints
    rotation: >-
      The platform-operator mints a successor of a token older than 30 days,
      waits until the consumer Secret holds it for 10 minutes, and removes each
      other token of the user (gibson#1041, charts#537). Reloader restarts
      zitadel-login. The test makes a token due by writing an old mint time at
      the OpenBao key.
    revokes_old: true
    status: tested
    test: zitadel-bringup-tokens
    run: 2

  - name: keyring-generated-keys
    lifetime: set by the operator at stage 0 (ADR-0083)
    source: the bringup keyring members OPENBAO_SEAL_KEY, VELERO_REPO_PASSWORD
    rotation: >-
      At stage 0 on the operator workstation. scripts/keyring.sh rotate
      keeps the old value as <MEMBER>_PREVIOUS, keyring-to-cluster.sh writes
      both, and OpenBao starts with both seal keys and rewraps with the new
      one; retire then clears the previous key. A new Velero password starts
      a new repository at a new bucket.prefix, and the previous password
      reads the old one. The test rotates the seal key of the drill env, and
      proves the Velero password with a backup.
    revokes_old: true
    status: tested
    test: keyring-generated-keys
    run: 1

  - name: setec-disk-signing-seed
    lifetime: set by the operator at stage 0 (ADR-0083)
    source: the bringup keyring member SETEC_DISK_SIGNING_SEED, and its public key in setec.launcher.diskBuilder.publicKeys of each cloud overlay (D85)
    rotation: >-
      At stage 0 on the operator workstation (scripts/keyring.sh, ROTATION).
      keyring.sh rotate keeps the old seed as SETEC_DISK_SIGNING_SEED_PREVIOUS,
      and the overlay commits both public keys (keyring.sh disk-public-keys),
      so each launcher accepts the disks of both seeds.
      keyring-to-cluster.sh moves the new seed to the disk builder. The
      recreate verb refuses an overlay whose keys are not exactly the keys of
      the keyring seeds.
      The drill keyring keeps a second, permanent seed in
      SETEC_DISK_SIGNING_SEED_PREVIOUS, and the drill overlay lists both
      public keys (owner decision of 2026-10-18, hosted#444, option a). The
      test switches the signing seed to the second one, waits until the disk
      builder holds it, boots a launcher Sandbox, and proves a disk signed
      by the new seed (its tag names the key id, setec#272), then switches
      back. Seed generation and the overlay update for a new key stay
      manual steps of a planned rotation.
    revokes_old: false
    status: tested
    test: setec-disk-signing-seed
    run: 3

  - name: substrate-cloud-credentials
    lifetime: 90 days, then scripts/substrate-rotate.sh
    source: stage 0 Terraform of the environment (substrate/gibson-bootstrap), two access key slots on each IAM user, which writes the keyring members BUCKET_ACCESS_KEY, BUCKET_SECRET_KEY, SMTP_PASSWORD, DNS_ACCESS_KEY, DNS_SECRET_KEY, SETEC_DISK_PUSH_ACCESS_KEY, SETEC_DISK_PUSH_SECRET_KEY
    rotation: >-
      make substrate-rotate ENV=<env> CREDENTIAL=<platform|smtp|dns|setec-disk-builder>
      at stage 0
      on the operator workstation (ADR-0083): a new key in the free slot, the
      keyring and the cluster move to it, and each reader restarts and runs
      again. For smtp the derived Secret, its readers and the Zitadel SMTP
      provider move too, and the relay must accept the new key. The old key
      is deleted only after that, and after AWS reports it unused since the
      switch. In the drill, rotation run 1 starts a rotation of each user
      (scripts/drill-rotate-keys.sh start) before this class runs, and the
      later drill runs continue it. The class runs in run 1, so it proves the open
      rotation: the cluster holds the newer key, and AWS reports no use of
      the older key since the switch. With no open rotation it proves the
      result: one key on each user, the key of the cluster, at most 90 days
      old, so AWS refuses every older key. The no-outage half is proved by the script's own
      waits and by tests/harness/substrate-rotate.bats.
    revokes_old: true
    status: tested
    test: substrate-cloud-credentials
    run: 1
  - name: vendor-issued-inputs
    lifetime: 365 days from the recorded set time (keyring.sh set)
    source: the issuer of each value (GitHub for GHCR_PULL_TOKEN and GITHUB_APP_PRIVATE_KEY, Stripe for STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY and STRIPE_WEBHOOK_SECRET), then the bringup keyring
    rotation: >-
      A person gets a new value from the vendor and runs `keyring.sh set`,
      which records the time. keyring-to-cluster.sh writes the value and the
      time (an annotation of bringup-keyring), and the openbao-auto-init
      sidecar copies the value into OpenBao on its next pass (kinds input and
      inputor). Stripe signs with the old and the new webhook secret during
      its roll, so the billing-webhook needs only the new one. `set`
      refuses the value already set, so each set time is a new value. The
      test proves the set times and that the billing-webhook takes events
      signed with its secret. The old value ends at the vendor: the person
      revokes it there (GitHub token or App key, Stripe key roll). The
      platform does not keep the old value, so the drill cannot prove that
      the vendor refuses it.
    revokes_old: false
    status: tested
    test: vendor-issued-inputs
    run: 3

